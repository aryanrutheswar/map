<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Native Maps Studio — Live Localhost Visualizer</title>
  <meta name="description" content="Interactive map studio and React Native Maps code generator running locally on localhost:3000.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Custom Styling -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
            <line x1="8" y1="2" x2="8" y2="18"></line>
            <line x1="16" y1="6" x2="16" y2="22"></line>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-title">RN Maps Studio</div>
          <div class="brand-badge">2026 Live Engine • Localhost:3000</div>
        </div>
      </div>

      <!-- Search Location -->
      <div class="search-container">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Search any city or address..." autocomplete="off">
        <div id="searchResults" class="search-dropdown"></div>
      </div>

      <!-- Quick Actions -->
      <div class="header-actions">
        <button id="locateBtn" class="btn btn-secondary" title="Locate Me">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span>My Location</span>
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <div class="workspace">
      <!-- Map Container -->
      <div id="map" class="map-view"></div>

      <!-- Floating Map Layer Selector -->
      <div class="floating-layers-dock">
        <button class="layer-pill active" data-layer="googleRoads">Google 2026 Streets</button>
        <button class="layer-pill" data-layer="googleSat">Google Satellite</button>
        <button class="layer-pill" data-layer="googleTerrain">Terrain</button>
      </div>

      <!-- Telemetry HUD -->
      <div class="telemetry-hud">
        <div class="hud-item">
          <span class="hud-label">LAT / LNG</span>
          <span id="hudCoords" class="hud-value">37.7749, -122.4194</span>
        </div>
        <div class="hud-divider"></div>
        <div class="hud-item">
          <span class="hud-label">ZOOM</span>
          <span id="hudZoom" class="hud-value">13</span>
        </div>
        <div class="hud-divider"></div>
        <div class="hud-item">
          <span class="hud-label">PINS</span>
          <span id="hudMarkersCount" class="hud-value">1</span>
        </div>
        <div class="hud-divider"></div>
        <div class="hud-item">
          <span class="hud-label">STATUS</span>
          <span class="hud-value status-online"><span class="pulse-dot"></span> Live</span>
        </div>
      </div>

      <!-- Google Maps Style Navigation Controls -->
      <div class="google-nav-controls">
        <button id="navLocateBtn" class="nav-btn nav-locate-btn" title="Your Location">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="7"></circle>
            <line x1="12" y1="1" x2="12" y2="5"></line>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="1" y1="12" x2="5" y2="12"></line>
            <line x1="19" y1="12" x2="23" y2="12"></line>
            <circle cx="12" cy="12" r="2.5" fill="currentColor"></circle>
          </svg>
        </button>

        <div class="nav-zoom-dock">
          <button id="navZoomInBtn" class="nav-zoom-btn" title="Zoom In">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <div class="nav-zoom-divider"></div>
          <button id="navZoomOutBtn" class="nav-zoom-btn" title="Zoom Out">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>

    </div>
  </div>

  <div id="toast" class="toast">Code copied to clipboard!</div>

  <script src="app.js"></script>
</body>
</html>
